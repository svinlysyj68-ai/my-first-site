<!DOCTYPE html>
<html>
<head>
    <title>Мой прокачанный сайт</title>
    <style>
        /* Здесь мы настраиваем внешний вид */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            background: #1e1e24; /* Сделали фон темно-серым */
            color: #ffffff; /* Сделали текст белым */
            padding-top: 50px;
        }
        h1 { color: #4dadff; } /* Голубой заголовок */
        
        /* Красивая современная кнопка */
        .my-btn { 
            padding: 12px 25px; 
            font-size: 16px; 
            background: #4dadff; 
            color: #1e1e24; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold;
            cursor: pointer; 
            transition: 0.3s; /* Плавное изменение цвета */
        }
        /* Эффект при наведении мышки на кнопку */
        .my-btn:hover {
            background: #ffffff;
            transform: scale(1.05); /* Кнопка чуть увеличится */
        }
    </style>
</head>
<body>
    <h1>Рома Карпцов петух 67</h1>
    <p>Тамик жирный таракан ест собаку</p>
    <img src="https://i.pinimg.com/736x/a4/48/95/a448952416346775683d7092465213af.jpg" alt="Моя картинка" style="width: 300px; border-radius: 12px; margin: 20px;">
    <br><br>
    <button class="my-btn" onclick="alert('Запущена баллистичекая ракета в дом Елбакиева ✅')">Нажми на меня</button>
</body>
</html>
